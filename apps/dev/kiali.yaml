apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 2.12.0
    helm:
      releaseName: kiali
      valuesObject:
        auth:
          strategy: anonymous
        external_services:
          prometheus:
            url: http://prometheus-server.istio-system:9090
          tracing:
            enabled: true
            provider: jaeger
            internal_url: http://jaeger.jaeger:16686
            external_url: https://jaeger.k3s.dgkim.net
            use_grpc: false
        server:
          web_root: /
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
