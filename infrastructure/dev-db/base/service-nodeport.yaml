apiVersion: v1
kind: Service
metadata:
  name: dev-db-nodeport
  labels:
    app.kubernetes.io/name: dev-db
    app.kubernetes.io/component: postgres
spec:
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
  selector:
    app.kubernetes.io/name: dev-db
    app.kubernetes.io/component: postgres
