apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kube-hello-app
  labels:
    app: kube-hello-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: kube-hello-app
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 100
  template:
    metadata:
      labels:
        app: kube-hello-app
    spec:
      serviceAccountName: kube-hello-app
      containers:
        - name: kube-hello-app
          image: ghcr.io/dgkim-lab/kube-hello-app:v0.0.2
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
